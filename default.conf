server {
    listen       80;
    server_name  localhost;

    # Lokasi file build React (dist) di dalam container Nginx
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Pengalihan SPA ke index.html jika rute tidak ditemukan
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy semua panggilan API ke Backend KSOP di port 3003
    location /api/ {
        proxy_pass http://10.10.20.20:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
