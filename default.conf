server {
    listen 80 ssl default_server;
    listen 443 ssl;
    server_name _;

    # SSL Certificate Configuration (Persis seperti Buku-Tamu)
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Auto-redirect plain HTTP requests to HTTPS preserving the exact port number
    error_page 497 https://$http_host$request_uri;

    # Batas ukuran upload foto inspeksi KTP kamera mobile
    client_max_body_size 50M;

    # 1. Serve Frontend Build (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Assets serving
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # 2. Reverse Proxy API requests to Node.js backend di port 3003
    location /api/ {
        proxy_pass http://10.10.20.20:3003/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Serve uploaded photos / static images dari backend
    location /images/ {
        proxy_pass http://10.10.20.20:3003/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Error page handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
