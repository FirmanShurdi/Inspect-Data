server {
    listen       80;
    server_name  localhost;

    # Lokasi file build React (dist) di dalam container Nginx
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Pengalihan SPA ke index.html jika rute tidak ditemukan
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
